<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tải nhạc MP3 từ YouTube</title>

<!-- ===== PWA: cài được thành app riêng trên màn hình chính (Android & iOS) ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YT2MP3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<!-- ===== Hết phần PWA ===== -->

<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h1>🎵 Tải nhạc MP3 từ YouTube</h1>
    <p class="hint">Dán link video YouTube vào ô bên dưới, chỉ dùng cho nội dung bạn có quyền tải (video của bạn, nội dung được cấp phép tự do, v.v).</p>

    <form id="form" class="box">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off">
      <button type="submit" id="btnFetch">Kiểm tra video</button>
    </form>

    <div id="error" class="error" hidden></div>

    <div id="result" class="result" hidden>
      <img id="thumb" alt="Thumbnail">
      <div class="meta">
        <div id="title" class="title"></div>
        <div id="sub" class="sub"></div>
        <button id="btnDownload" class="download">⬇ Tải MP3</button>
        <div id="status" class="status"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
