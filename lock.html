<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TN5 Dashboard — Ngoài giờ truy cập</title>
</head>
<body style="margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:24px;box-sizing:border-box">
  <div style="max-width:360px;width:100%">
    <div style="font-size:40px;margin-bottom:12px">🌙</div>
    <h2 style="margin:0 0 8px">Ngoài giờ truy cập</h2>
    <p id="lock-desc" style="margin:0 0 20px;color:#aaa">Đang kiểm tra lịch ca…</p>
    <div id="gate-pass-wrap" style="display:none;flex-direction:column;gap:8px">
      <input type="password" id="gate-pass-input" placeholder="Nhập mật khẩu" autocomplete="off" style="padding:10px 12px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;font-size:15px;box-sizing:border-box;width:100%">
      <button id="gate-unlock-btn" style="padding:10px 18px;border-radius:8px;border:none;background:#444;color:#fff;font-size:15px;cursor:pointer">🔓 Mở khoá</button>
    </div>
    <div id="gate-actions" style="display:none;margin-top:16px;flex-direction:column;gap:8px">
      <button id="gate-open-now" style="padding:10px 14px;border-radius:8px;border:none;background:#2e7d32;color:#fff;font-size:14px;cursor:pointer"></button>
      <button id="gate-switch-mode" style="padding:10px 14px;border-radius:8px;border:none;background:#1565c0;color:#fff;font-size:14px;cursor:pointer"></button>
    </div>
    <p id="gate-msg" style="margin:12px 0 0;color:#e57373;font-size:13px"></p>
  </div>

<script>
// Trang chặn RIÊNG BIỆT (điều hướng thật sự tới đây bằng location.replace() từ index.html) — thay
// vì document.write() ngay trong index.html (đã thử nhưng KHÔNG đáng tin cậy: document.write() gọi
// giữa lúc trang đang được phân tích không xoá được phần còn lại của tài liệu gốc, toàn bộ app vẫn
// âm thầm tải/chạy phía sau màn hình chặn — đã tự kiểm chứng bằng trình duyệt thật và phát hiện lỗi
// này). Điều hướng sang 1 trang HTML riêng là cách DUY NHẤT chặn chắc chắn 100%: khi trình duyệt
// điều hướng sang trang khác, nó luôn dừng hẳn việc phân tích/chạy tiếp trang cũ.
const LS_SHIFT_MODE = 'tn5_shift_mode'; // 'night' (mặc định, 19h-7h) | 'day' (7h-19h)
const LS_OVERRIDE_UNTIL = 'tn5_gate_override_until'; // mốc thời gian (ms) còn hiệu lực mở tạm ngoài giờ
const LS_MANUAL_LOCK = 'tn5_gate_manual_lock'; // '1' = vừa bị khoá thủ công (nút 🔒 trong Cài đặt) — chặn NGAY dù đang trong giờ ca, tới khi mở lại bằng mật khẩu ở đây
const GATE_PASSWORD = 'qqqwww';
const OVERRIDE_HOURS = 12; // mở tạm ngoài giờ có hiệu lực trong 12 giờ kể từ lúc bấm

// ĐỒNG BỘ ĐA THIẾT BỊ: lịch ca/mở-tạm/khoá-thủ-công lấy TỪ CLOUD (Firebase, đúng databaseURL/token
// đã cấu hình cho CloudVault, lưu ở khoá riêng "_gate_config" — không đụng dữ liệu chính app) là
// nguồn xác thực chính — localStorage chỉ là bản sao cục bộ (dùng khi mất mạng/chưa cấu hình Cloud).
function gateCloudCreds(){
  try{
    const url = localStorage.getItem('tn5_cloud_gas_url');
    const token = localStorage.getItem('tn5_cloud_gas_token');
    return (url && token) ? { url, token } : null;
  }catch(e){ return null; }
}
async function gateFetchCloudConfig(){
  const creds = gateCloudCreds();
  if(!creds) return null;
  try{
    const url = creds.url.replace(/\/+$/, '') + '/dashboard_data/_gate_config.json?auth=' + encodeURIComponent(creds.token) + '&_ts=' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) return null;
    const data = await res.json();
    return (data && typeof data === 'object') ? data : null;
  }catch(e){ return null; }
}
function gateApplyCloudConfig(cfg){
  if(!cfg) return;
  try{
    if(cfg.mode === 'day' || cfg.mode === 'night') localStorage.setItem(LS_SHIFT_MODE, cfg.mode);
    if(typeof cfg.overrideUntil === 'number') localStorage.setItem(LS_OVERRIDE_UNTIL, String(cfg.overrideUntil));
    localStorage.setItem(LS_MANUAL_LOCK, cfg.manualLock ? '1' : '0');
  }catch(e){}
}
async function gateWriteCloudConfig(partial){
  const creds = gateCloudCreds();
  if(!creds) return false;
  try{
    const url = creds.url.replace(/\/+$/, '') + '/dashboard_data/_gate_config.json?auth=' + encodeURIComponent(creds.token);
    const payload = Object.assign({ updatedAt: Date.now() }, partial);
    const res = await fetch(url, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), cache: 'no-store' });
    return res.ok;
  }catch(e){ return false; }
}

function shiftMode(){
  try{ return localStorage.getItem(LS_SHIFT_MODE) === 'day' ? 'day' : 'night'; }catch(e){ return 'night'; }
}
function overrideActive(){
  try{ return Number(localStorage.getItem(LS_OVERRIDE_UNTIL) || 0) > Date.now(); }catch(e){ return false; }
}
function manualLocked(){
  try{ return localStorage.getItem(LS_MANUAL_LOCK) === '1'; }catch(e){ return false; }
}
function dangChoPhep(){
  if(manualLocked()) return false;
  const gioVN = new Date().toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' });
  const gio = new Date(gioVN).getHours();
  const mode = shiftMode();
  const trongCa = mode === 'day' ? (gio >= 7 && gio < 19) : (gio >= 19 || gio < 7);
  return trongCa || overrideActive();
}
// Nối thêm 1 tham số luôn-khác-nhau vào URL trước khi điều hướng — CHỐNG CACHE, xem lý do đầy đủ ở
// bản index.html (khối chặn ca đầu <body>): buộc trình duyệt tải lại thật, không trả nhầm 1 bản cũ
// đã cache của index.html/lock.html.
function gateBustedUrl(base){
  try{
    const params = new URLSearchParams(location.search);
    params.delete('_t');
    params.set('_t', Date.now());
    return base + '?' + params.toString();
  }catch(e){ return base + '?_t=' + Date.now(); }
}

function renderLockScreen(){
  const mode = shiftMode();
  const caHienTai = mode === 'day' ? 'Ca ngày (07:00 – 19:00)' : 'Ca đêm (19:00 – 07:00)';
  const caKhac = mode === 'day' ? 'night' : 'day';
  const caKhacLabel = mode === 'day' ? 'Ca đêm (19:00 – 07:00)' : 'Ca ngày (07:00 – 19:00)';

  document.getElementById('lock-desc').innerHTML = (manualLocked() ? 'Trang vừa được <b>khoá thủ công</b>. ' : '') +
    'Dashboard đang áp dụng lịch: <b>' + caHienTai + '</b> (giờ Việt Nam).';
  document.getElementById('gate-open-now').textContent = '✓ Mở truy cập ngay (hiệu lực ' + OVERRIDE_HOURS + ' giờ)';
  document.getElementById('gate-switch-mode').textContent = '🔁 Đổi lịch sang: ' + caKhacLabel;
  document.getElementById('gate-pass-wrap').style.display = 'flex';

  document.getElementById('gate-open-now').onclick = async function(){
    const until = Date.now() + OVERRIDE_HOURS * 3600 * 1000;
    try{
      localStorage.removeItem(LS_MANUAL_LOCK); // mật khẩu đúng -> tự xoá luôn cờ khoá thủ công (nếu có)
      localStorage.setItem(LS_OVERRIDE_UNTIL, String(until));
    }catch(e){}
    try{ await gateWriteCloudConfig({ manualLock: false, overrideUntil: until }); }catch(e){}
    location.replace(gateBustedUrl('index.html'));
  };
  document.getElementById('gate-switch-mode').onclick = async function(){
    try{
      localStorage.removeItem(LS_MANUAL_LOCK); // mật khẩu đúng -> tự xoá luôn cờ khoá thủ công (nếu có)
      localStorage.setItem(LS_SHIFT_MODE, caKhac);
    }catch(e){}
    try{ await gateWriteCloudConfig({ manualLock: false, mode: caKhac }); }catch(e){}
    location.replace(gateBustedUrl('index.html'));
  };
}

function gateTryUnlock(){
  const pass = document.getElementById('gate-pass-input').value;
  if(pass !== GATE_PASSWORD){
    document.getElementById('gate-msg').textContent = '✗ Sai mật khẩu.';
    return;
  }
  document.getElementById('gate-msg').textContent = '';
  document.getElementById('gate-pass-wrap').style.display = 'none';
  document.getElementById('gate-actions').style.display = 'flex';
}
document.getElementById('gate-unlock-btn').addEventListener('click', gateTryUnlock);
document.getElementById('gate-pass-input').addEventListener('keydown', function(e){ if(e.key === 'Enter') gateTryUnlock(); });

// Kiểm tra ngay khi vào trang: chờ đồng bộ Cloud xong (nếu có cấu hình) rồi mới quyết định — tránh
// trường hợp máy khác vừa mở lại quyền/đổi ca mà trang này còn dùng bản cục bộ cũ, hiện nhầm màn
// hình khoá dù thực ra đã tới lúc được vào (hoặc ngược lại).
(async function(){
  const cfg = await gateFetchCloudConfig();
  if(cfg) gateApplyCloudConfig(cfg);
  if(dangChoPhep()){
    location.replace(gateBustedUrl('index.html'));
    return;
  }
  renderLockScreen();
})();

// Tự kiểm tra lại mỗi 30 giây (kèm đồng bộ Cloud) — nếu đúng lúc ca bắt đầu, hoặc lịch/mở-tạm/khoá
// vừa được cấu hình từ thiết bị khác, thì tự động quay lại app hoặc cập nhật đúng màn hình khoá,
// không bắt người dùng phải tự bấm tải lại.
setInterval(async function(){
  const cfg = await gateFetchCloudConfig();
  if(cfg) gateApplyCloudConfig(cfg);
  if(dangChoPhep()){
    location.replace(gateBustedUrl('index.html'));
  } else {
    renderLockScreen();
  }
}, 30000);
</script>
</body>
</html>
